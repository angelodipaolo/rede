<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Rede ("net"): a review thread over a woven net. macOS icon grid: 824 px body, 100 px margin. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#6f7cff"/>
      <stop offset="0.55" stop-color="#4b55d6"/>
      <stop offset="1" stop-color="#2e2f9e"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eceefe"/>
    </linearGradient>
    <clipPath id="body">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#14164f" flood-opacity="0.35"/>
    </filter>
    <filter id="iconshadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g filter="url(#iconshadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#bg)"/>
  </g>

  <!-- The net: two families of diagonal threads with knots where they cross. -->
  <g clip-path="url(#body)" stroke="#ffffff" stroke-opacity="0.13" stroke-width="10" fill="none" stroke-linecap="round">
    <path d="M-60 300 L300 -60 M-60 520 L520 -60 M-60 740 L740 -60 M-60 960 L960 -60 M100 1020 L1020 100 M320 1020 L1020 320 M540 1020 L1020 540 M760 1020 L1020 760"/>
    <path d="M300 1084 L-60 724 M520 1084 L-60 504 M740 1084 L-60 284 M960 1084 L-60 64 M1020 924 L100 4 M1020 704 L320 4 M1020 484 L540 4 M1020 264 L760 4"/>
  </g>
  <g clip-path="url(#body)" fill="#ffffff" fill-opacity="0.22">
    <circle cx="168" cy="292" r="12"/><circle cx="278" cy="182" r="12"/><circle cx="168" cy="512" r="12"/><circle cx="278" cy="402" r="12"/><circle cx="388" cy="292" r="12"/><circle cx="498" cy="182" r="12"/><circle cx="168" cy="732" r="12"/><circle cx="278" cy="622" r="12"/><circle cx="388" cy="512" r="12"/><circle cx="498" cy="402" r="12"/><circle cx="608" cy="292" r="12"/><circle cx="718" cy="182" r="12"/><circle cx="278" cy="842" r="12"/><circle cx="388" cy="732" r="12"/><circle cx="498" cy="622" r="12"/><circle cx="608" cy="512" r="12"/><circle cx="718" cy="402" r="12"/><circle cx="828" cy="292" r="12"/><circle cx="498" cy="842" r="12"/><circle cx="608" cy="732" r="12"/><circle cx="718" cy="622" r="12"/><circle cx="828" cy="512" r="12"/><circle cx="718" cy="842" r="12"/><circle cx="828" cy="732" r="12"/>
  </g>

  <!-- The review thread: a comment bubble with diff lines. -->
  <g filter="url(#shadow)">
    <path d="M300 300 H724 A70 70 0 0 1 794 370 V610 A70 70 0 0 1 724 680 H500 L392 772 A12 12 0 0 1 372 762 L384 680 H300 A70 70 0 0 1 230 610 V370 A70 70 0 0 1 300 300 Z" fill="url(#bubble)"/>
  </g>
  <rect x="300" y="382" width="34" height="34" rx="8" fill="#e5484d"/>
  <rect x="356" y="384" width="280" height="30" rx="15" fill="#f2b8bb"/>
  <rect x="300" y="472" width="34" height="34" rx="8" fill="#22a05a"/>
  <rect x="356" y="474" width="368" height="30" rx="15" fill="#a6dcbb"/>
  <rect x="300" y="562" width="34" height="34" rx="8" fill="#22a05a"/>
  <rect x="356" y="564" width="220" height="30" rx="15" fill="#a6dcbb"/>
</svg>
